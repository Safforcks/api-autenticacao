server:
  port: 8082

spring:
  application:
    name: api-autenticacao

  datasource:
    url: "jdbc:h2:mem:bd-autenticacao;DB_CLOSE_DELAY=-1"
    username: software
    password: software
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true